<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>UI Layout Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== ツールバー ========== -->
<div id="toolbar">
  <div class="tb-group">
    <button id="btn-open-workspace" title="ワークスペースを開く">📁 開く</button>
    <button id="btn-new-file" title="新規ファイル作成" disabled>📄 新規</button>
    <button id="btn-save" title="保存 (Ctrl+S)" disabled>💾 保存</button>
    <button id="btn-export-json" title="JSON エクスポート" disabled>📤 Export</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="btn-undo" title="元に戻す (Ctrl+Z)" disabled>↩ Undo</button>
    <button id="btn-redo" title="やり直す (Ctrl+Y)" disabled>↪ Redo</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="btn-delete" title="選択削除 (Del)" disabled>🗑 削除</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group tb-canvas-size">
    <label>キャンバス</label>
    <select id="canvas-size-select">
      <option value="1280x720">1280 × 720</option>
      <option value="720x1280">720 × 1280</option>
      <option value="960x540">960 × 540</option>
      <option value="1920x1080">1920 × 1080</option>
      <option value="custom">カスタム</option>
    </select>
    <div id="custom-canvas-inputs" style="display:none; align-items:center; gap:4px; margin-left:8px;">
      <input type="number" id="canvas-custom-w" style="width:50px; background:#333; color:#fff; border:1px solid #555; border-radius:3px; padding:2px;" title="Width">
      <span>x</span>
      <input type="number" id="canvas-custom-h" style="width:50px; background:#333; color:#fff; border:1px solid #555; border-radius:3px; padding:2px;" title="Height">
    </div>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="btn-zoom-out" title="縮小">－</button>
    <span id="zoom-display">100%</span>
    <button id="btn-zoom-in" title="拡大">＋</button>
    <button id="btn-zoom-fit" title="全体表示">Fit</button>
  </div>
  <div class="tb-spacer"></div>
  <div id="file-status">
    <span id="current-file-name">Untitled</span>
    <span id="dirty-dot" title="未保存の変更あり" style="display:none">●</span>
  </div>
</div>

<!-- ========== メインレイアウト ========== -->
<div id="editor-layout">

  <!-- 左パネル -->
  <div id="left-panel">
    <div id="left-tabs">
      <button class="tab-btn active" data-tab="parts">部品</button>
      <button class="tab-btn" data-tab="files">ファイル</button>
      <button class="tab-btn" data-tab="assets">アセット</button>
    </div>

    <!-- 部品タブ -->
    <div id="tab-parts" class="tab-content active">
      <div id="component-library"></div>
    </div>

    <!-- ファイルタブ -->
    <div id="tab-files" class="tab-content">
      <div id="workspace-file-list">
        <div class="panel-empty">
          「📁 開く」でワークスペースフォルダを選択してください
        </div>
      </div>
    </div>

    <!-- アセットタブ -->
    <div id="tab-assets" class="tab-content">
      <div id="asset-browser-toolbar">
        <button id="btn-refresh-assets">↻ 更新</button>
        <button id="btn-set-asset-dir">📁 フォルダ設定</button>
        <span id="asset-count"></span>
      </div>
      <div id="asset-browser">
        <div class="panel-empty">「📁 開く」でワークスペースを選択してください</div>
      </div>
    </div>

    <!-- レイヤーパネル（常時表示） -->
    <div id="layer-panel">
      <div id="layer-panel-header">
        <span>レイヤー</span>
        <div class="layer-actions">
          <button id="btn-layer-up"   title="前面へ">↑</button>
          <button id="btn-layer-down" title="背面へ">↓</button>
        </div>
      </div>
      <div id="layer-list">
        <div class="panel-empty">要素なし</div>
      </div>
    </div>
  </div>

  <!-- キャンバスエリア -->
  <div id="canvas-area">
    <div id="canvas-viewport">
      <div id="canvas-outer">
        <div id="canvas-inner">
          <!-- 要素はここに挿入される -->
          <div id="selection-overlay">
            <div class="handle" data-dir="nw"></div>
            <div class="handle" data-dir="n"></div>
            <div class="handle" data-dir="ne"></div>
            <div class="handle" data-dir="e"></div>
            <div class="handle" data-dir="se"></div>
            <div class="handle" data-dir="s"></div>
            <div class="handle" data-dir="sw"></div>
            <div class="handle" data-dir="w"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="canvas-coords">X: 0  Y: 0</div>
  </div>

  <!-- 右パネル（プロパティ） -->
  <div id="right-panel">
    <div id="right-panel-header">プロパティ</div>
    <div id="properties-panel">
      <div class="panel-empty">要素を選択してください</div>
    </div>
  </div>

</div>

<script src="templates.js"></script>
<script src="editor.js"></script>
<script src="renderer.js"></script>
</body>
</html>
