id: linear_gauge_base
category: pattern
role: data_display
importance: info
intent: "直線ゲージで進捗/残量を表示する"
when:
  - "横長エリアで進捗を見せたい"
  - "縦長エリアで残量を見せたい"
avoid:
  - "円形表示が適している場合"
constraint_flags:
  - safe_area
states:
  - default
layout_ref:
  type: slot
  example: "slot:gauge_linear"
value_model:
  meaning: progress
  value: 0.7
  max: 1
  unit: ratio
shape_profile: linear
shape_params:
  orientation: horizontal
  thickness: 24
export_hint:
  default_size:
    width: 360
    height: 48
notes:
  - "意味(value_model)と形状(shape_profile)を分離する"
  - "orientationでhorizontal/verticalを切り替え可能"
